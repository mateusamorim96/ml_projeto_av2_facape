name: Validar Entrega do Grupo

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  validar:
    name: Escopo, estrutura, dados e segredos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detectar grupo e entrega no titulo do PR
        id: alvo
        env:
          TITULO: ${{ github.event.pull_request.title || github.event.head_commit.message || '' }}
        run: |
          NUM=$(printf '%s' "$TITULO" \
            | grep -oEi '(^|[^a-z0-9])(g|grupo[- ]?)[0-9]{1,2}([^0-9]|$)' \
            | grep -oE '[0-9]{1,2}' \
            | head -1)

          if [ -z "$NUM" ]; then
            echo "::error::Nao foi possivel detectar o grupo no titulo do PR."
            echo "Use o formato: [G03] Entrega E4 - Saneamento e perda de agua"
            exit 1
          fi
          GRUPO=$(printf 'grupo-%02d' "$((10#$NUM))")
          echo "grupo=$GRUPO" >> "$GITHUB_OUTPUT"

          ENTREGA=$(printf '%s' "$TITULO" | grep -oEi '\bE[1-8]\b' | head -1 | tr '[:lower:]' '[:upper:]')
          if [ -n "$ENTREGA" ]; then
            echo "entrega=$ENTREGA" >> "$GITHUB_OUTPUT"
            echo "Entrega detectada: $ENTREGA"
          else
            echo "entrega=" >> "$GITHUB_OUTPUT"
            echo "::warning::Entrega nao detectada no titulo. Use: [G03] Entrega E4 - Nome do tema"
          fi
          echo "Grupo detectado: $GRUPO"

      - name: Validar entrega do grupo
        env:
          GRUPO: ${{ steps.alvo.outputs.grupo }}
          ENTREGA: ${{ steps.alvo.outputs.entrega }}
          BASE: origin/${{ github.base_ref }}
        run: |
          set -o pipefail
          if [ -n "$ENTREGA" ]; then
            ARG_ENTREGA="--entrega $ENTREGA"
          else
            ARG_ENTREGA=""
          fi
          python3 scripts/check_entrega.py --grupo "$GRUPO" --base "$BASE" $ARG_ENTREGA \
            | tee validacao.txt

      - name: Validar namespace (todos os grupos)
        if: always()
        run: |
          python3 scripts/check_entrega.py --namespace | tee -a validacao.txt

      - name: Conferir padrao de commits
        if: always()
        run: |
          BASE="origin/${{ github.base_ref }}"
          PADRAO=$(printf '%s' "${{ steps.alvo.outputs.grupo }}" | sed -E 's/grupo-([0-9]{2})/^\\[G\1\\] (feat|fix|docs|test|refactor|chore): .+/')
          FORA=0
          while IFS= read -r MSG; do
            case "$MSG" in
              Merge*|Revert*|"") continue ;;
            esac
            if ! printf '%s' "$MSG" | grep -qE "$PADRAO"; then
              echo "::warning::Commit fora do padrao: $MSG"
              FORA=$((FORA + 1))
            fi
          done < <(git log --format=%s "$BASE"..HEAD)

          if [ "$FORA" -gt 0 ]; then
            echo "### Aviso" >> "$GITHUB_STEP_SUMMARY"
            echo "$FORA commit(s) fora do padrao \`[GNN] tipo: descricao\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Commits no padrao."
          fi

      - name: Publicar resumo
        if: always()
        run: |
          {
            echo "## Validacao da entrega"
            echo ""
            echo '```text'
            cat validacao.txt 2>/dev/null || echo "validacao nao executada"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
